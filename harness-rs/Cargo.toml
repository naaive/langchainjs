[workspace]
resolver = "2"
members = [
    "crates/harness-core",
    "crates/harness-macros",
    "crates/harness-anthropic",
    "crates/harness-openai",
    "crates/harness-agent",
    "examples/code-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
harness-core = { path = "crates/harness-core" }
harness-macros = { path = "crates/harness-macros" }
harness-agent = { path = "crates/harness-agent" }
harness-anthropic = { path = "crates/harness-anthropic" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
tokio = { version = "1", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
async-stream = "0.3"
tracing = "0.1"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
bytes = "1"
